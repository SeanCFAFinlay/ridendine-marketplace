name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Required for Next.js build (dummy values for CI only)
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
  SUPABASE_SERVICE_ROLE_KEY: placeholder_service_role_key
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
  STRIPE_SECRET_KEY: sk_test_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_placeholder

jobs:
  quality:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production data hygiene (IRR-015)
        run: pnpm verify:prod-data-hygiene
      # There was previously no dependency scanning of any kind in a repository
      # that handles payments. Fails on high/critical advisories only, so a
      # low-severity transitive advisory cannot block a hotfix.
      - name: Dependency audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
      - name: Migration immutability
        run: pnpm audit:migrations
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: API route guard audit
        run: pnpm audit:guards
      - name: DB boundary ratchet
        run: pnpm audit:db-boundary
      - name: Test (engine)
        run: pnpm --filter @ridendine/engine test
      - name: Test (db)
        run: pnpm --filter @ridendine/db test
      - name: Test (auth)
        run: pnpm --filter @ridendine/auth test
      - name: Test (utils)
        run: pnpm --filter @ridendine/utils test
      # These five packages had test files that no CI job ever executed.
      # @ridendine/validation is the important one: its Zod schemas are the
      # validation boundary for every API route.
      - name: Test (validation)
        run: pnpm --filter @ridendine/validation test
      - name: Test (routing)
        run: pnpm --filter @ridendine/routing test
      - name: Test (types)
        run: pnpm --filter @ridendine/types test
      - name: Test (ui)
        run: pnpm --filter @ridendine/ui test
      - name: Test (notifications)
        run: pnpm --filter @ridendine/notifications test
      - name: Test (web)
        run: pnpm --filter @ridendine/web test
      - name: Test (ops-admin)
        run: pnpm --filter @ridendine/ops-admin test
      - name: Test (chef-admin)
        run: pnpm --filter @ridendine/chef-admin test
      - name: Test (driver-app)
        run: pnpm --filter @ridendine/driver-app test
      - name: Test wiring and smoke contracts
        run: pnpm test:wiring-fixes
      - name: Build
        run: pnpm build

  smoke-e2e:
    name: Playwright Browser Gate
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run smoke E2E
        run: pnpm test:smoke
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
